name: MileNote

options:
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: "1.0.1"
  CURRENT_PROJECT_VERSION: 111
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  TARGETED_DEVICE_FAMILY: "1,2"
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGN_IDENTITY: ""
  PROVISIONING_PROFILE_SPECIFIER: ""
  DEVELOPMENT_TEAM: ""
  ENABLE_BITCODE: NO
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

targets:
  MileNote:
    type: application
    platform: iOS
    sources:
      - path: MileNote
        excludes:
          - Assets/Icons
    resources:
      - path: MileNote/Assets/Icons
    settings:
      PRODUCT_NAME: MileNote
      PRODUCT_BUNDLE_IDENTIFIER: com.selwiro.milenote.ios
      INFOPLIST_FILE: MileNote/Info.plist
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      DEVELOPMENT_TEAM: ""
